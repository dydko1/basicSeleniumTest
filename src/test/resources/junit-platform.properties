# ======================================================
# USTAWIENIA CUCUMBERA (wcze?niejsze adnotacje @ConfigurationParameter)
# ======================================================

# Tagi do filtrowania testów (odpowiednik FILTER_TAGS_PROPERTY_NAME)
cucumber.filter.tags=@TablesType or @TablesType1

# Ustawienia wyj?cia i raportów
cucumber.plugin=pretty, html:target/cucumber-reports/index.html, json:target/cucumber-reports/cucumber.json

# Ustawienie opcji CLI Cucumbera
cucumber.options=--strict

# ======================================================
# USTAWIENIA JUNIT PLATFORM (tryb równoleg?y)
# ======================================================

# W??czenie trybu równoleg?ego dla silników testowych
cucumber.execution.parallel.enabled=true

# Konfiguracja równoleg?o?ci (np. 4 w?tki)
cucumber.execution.parallel.config.fixed.thread.count=4

# Strategia dystrybucji scenariuszy
#cucumber.execution.parallel.config.strategy=fixed